name: Deploy GitHub Pages demo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build-pages-demo.cjs'
      - 'package*.json'
      - 'tsconfig.json'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
      - uses: actions/configure-pages@v5
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: /durian-hub01
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-demo-build/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
