<text x="1150" y="1147.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#183f32">แจ้งข้อมูลหรือเอกสารให้แก้ไข</text>
<text x="700" y="2120" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#526960">สีเขียว: เริ่ม/สำเร็จ    สีเหลือง: เงื่อนไข    สีฟ้า: ข้อมูล    สีแดง: ไม่ผ่าน/ข้อผิดพลาด</text>
<text x="700" y="2156" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#36574a">บทบาทหลักตอนสมัครเป็น ACTIVE และ isVerified=false • การขอเพิ่มบทบาทเป็นคนละขั้นตอนกับสมัครบัญชี</text>
