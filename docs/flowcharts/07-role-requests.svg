<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2238" viewBox="0 0 1400 2238" role="img" aria-labelledby="title desc"><title id="title">บทบาทผู้ใช้และคำขอเพิ่มบทบาท</title><desc id="desc">ผู้ใช้หนึ่งคนมีหลายบทบาทได้ โดยผู้ดูแลตรวจคำขอพร้อมเอกสาร</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#536b63"/></marker></defs><rect width="100%" height="100%" fill="#f7faf9"/><g font-family="Tahoma, Leelawadee UI, sans-serif">
